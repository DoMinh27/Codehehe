{% extends "base.html" %}

{% block title %}Đã đổi mật khẩu | CodeHehe{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block main_class %}site-main--narrow{% endblock %}

{% block content %}
<div class="auth-shell">
  <section class="card auth-card" aria-labelledby="password-reset-complete-title">
    <div class="auth-card__heading">
      <h1 id="password-reset-complete-title">Đã đổi mật khẩu</h1>
      <p>Mật khẩu mới đã được lưu. Bạn có thể đăng nhập lại</p>
    </div>
    <a class="button button--primary button--block" href="{% url 'login' %}">Đăng nhập</a>
  </section>
</div>
{% endblock %}
